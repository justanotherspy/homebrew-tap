name: Audit casks

# Detective control: re-validates every cask after it lands. Because source
# repos push generated casks straight to main, this runs on push (not just PRs)
# so a malformed, broken, or tampered cask is flagged within a minute.
# `--online` re-fetches each artifact and re-checks its URL and sha256.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # macOS runner: casks target macOS (garlic is macOS-only) and ship with
    # Homebrew preinstalled, so no third-party setup action is needed.
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Register checkout as a local tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/justanotherspy/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew style
        run: brew style justanotherspy/tap

      - name: brew audit (online)
        run: |
          for cask in "$GITHUB_WORKSPACE"/Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            echo "::group::audit $token"
            brew audit --cask --online "justanotherspy/tap/$token"
            echo "::endgroup::"
          done
