# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Lets the goreleaser job of go-template's Release workflow mint a short-lived,
# tap-scoped token to push its generated cask here, replacing the
# HOMEBREW_TAP_GITHUB_TOKEN PAT.
#
# That job declares no `environment:`, so the OIDC subject carries the ref.
# The workflow runs on the `release` event, where the ref is the release tag.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:justanotherspy/go-template:ref:refs/tags/v[0-9]+\.[0-9]+\.[0-9]+.*

permissions:
  contents: write
